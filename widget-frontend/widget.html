<!DOCTYPE html>
<!--
  Widget page - Architecture v5, Feature A ("Cupola-Native Inline Value Overlay")

  Usage: widget.html?id=iron_ore
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Widget</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    }
    ::-webkit-scrollbar {
      display: none;
    }

    #label {
      display: inline-block;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
      padding: 2px 6px;
    }

    #alarm {
      min-height: 24px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      padding: 0 6px 2px;
    }
  </style>
</head>

<body>
  <div id="label">--</div>
  <div id="alarm" role="status" aria-live="polite"></div>

  <script src="js/ws-client.js"></script>
  <script>
    /* =========================================================================
     * 🎛️ DEFAULT CONFIGURATION — CHANGE STYLING HERE IN ONE SINGLE LOCATION:
     * ========================================================================= */
    const DEFAULT_CONFIG = {
      color: "#ea580c",     // Text color (e.g. "#ea580c", "#ffffff", "#000000")
      size: "32px",         // Text font size (e.g. "32px", "24px", "20px")
      fontWeight: "700",    // Text weight ("600", "700", "bold")
      alarmColor: "#ff3b30",// Alarm text color
      alarmSize: "24px",    // Alarm font size
      decimals: 2,          // Default decimal places for numbers (e.g. 7.82 g)
    };
    /* ========================================================================= */

    // Use the host serving this widget, so remote devices reach the backend.
    const backendProtocol = window.location.protocol === "https:" ? "https:" : "http:";
    const websocketProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const API_BASE = `${backendProtocol}//${window.location.hostname}:4000`;
    const WS_URL = `${websocketProtocol}//${window.location.hostname}:4000/ws`;

    const params = new URLSearchParams(window.location.search);
    const itemId = params.get("id");
    const customColor = params.get("color");
    const customSize = params.get("size");
    const decimalsParam = params.get("decimals");
    const numDecimals = decimalsParam !== null && !isNaN(decimalsParam) ? parseInt(decimalsParam, 10) : DEFAULT_CONFIG.decimals;
    const valueOnly = params.get("valueOnly") === "true" || params.get("label") === "false";
    const hideAlarm = params.get("hideAlarm") === "true" || params.get("alarm") === "false";

    const labelEl = document.getElementById("label");
    const alarmEl = document.getElementById("alarm");

    // Resolve color & size: URL parameter takes priority, otherwise uses DEFAULT_CONFIG
    const resolvedColor = customColor
      ? (/^[0-9a-fA-F]{3,8}$/.test(customColor) ? `#${customColor}` : customColor)
      : DEFAULT_CONFIG.color;

    const resolvedSize = customSize
      ? (isNaN(customSize) ? customSize : `${customSize}px`)
      : (typeof DEFAULT_CONFIG.size === "number" ? `${DEFAULT_CONFIG.size}px` : DEFAULT_CONFIG.size);

    // Apply styles to elements
    labelEl.style.color = resolvedColor;
    labelEl.style.fontSize = resolvedSize;
    labelEl.style.fontWeight = DEFAULT_CONFIG.fontWeight;

    alarmEl.style.color = DEFAULT_CONFIG.alarmColor;
    alarmEl.style.fontSize = DEFAULT_CONFIG.alarmSize;
    if (hideAlarm) {
      alarmEl.style.display = "none";
    }

    const HOPPER_MATERIALS = ["gypsum", "clay", "iron_ore", "sand", "limestone", "lime_stone"];
    const DISPLAY_LABELS = {
      gypsum: "Gypsum",
      clay: "Clay",
      iron_ore: "Iron Ore",
      sand: "Sand",
      limestone: "Limestone",
      lime_stone: "Limestone Gate",
      klin_dht_temp: "Kiln Temp",
      klin_dht_humidity: "Kiln Humidity",
      cooler_dht_temp: "Cooler Temp",
      cooler_dht_humidity: "Cooler Humidity",
      preheating_tower_dht_temp: "Preheat Temp",
      preheating_tower_dht_humidity: "Preheat Humidity",
      vibration_sensor: "Vibration Value",
    };

    function render(itemId, value, unit) {
      let shown = value === null || value === undefined ? "--" : value;
      if (typeof shown === "number") {
        if (shown < 0) shown = 0;
        if (!Number.isInteger(shown)) {
          shown = shown.toFixed(numDecimals);
        }
      }
      const label = DISPLAY_LABELS[itemId] || itemId;
      labelEl.textContent = valueOnly
        ? `${shown}${unit ? " " + unit : ""}`
        : `${label}: ${shown}${unit ? " " + unit : ""}`;

      const weight = Number(value);
      const isHopper = HOPPER_MATERIALS.includes(itemId);

      if (!hideAlarm && isHopper && value !== null && value !== undefined && value !== "" && Number.isFinite(weight)) {
        if (weight > 20) {
          alarmEl.textContent = "OVERLOAD ALARM";
          alarmEl.style.color = DEFAULT_CONFIG.alarmColor;
        } else if (weight < 5) {
          alarmEl.textContent = "UNDER WEIGHT ALARM";
          alarmEl.style.color = DEFAULT_CONFIG.alarmColor;
        } else {
          alarmEl.textContent = "";
        }
      } else {
        alarmEl.textContent = "";
      }
    }

    if (!itemId) {
      labelEl.textContent = "missing ?id=";
    } else {
      // Initial snapshot so the label isn't blank before the first WS message.
      fetch(`${API_BASE}/api/item/${itemId}`)
        .then((r) => r.json())
        .then((data) => render(itemId, data.value, data.unit))
        .catch(() => { });

      // Live updates, scoped to just this item (Architecture v5, Section 4.2).
      connectWidgetSocket(WS_URL, itemId, (data) => {
        render(itemId, data.value, data.unit);
      });
    }
  </script>
</body>

</html>
